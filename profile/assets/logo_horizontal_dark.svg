<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" width="100%" height="100%">
  <defs>
    <!-- Wordmark Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="crawl-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Icon Weave Gradient -->
    <linearGradient id="icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <filter id="h-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Mark (Scaled & Translated to 120x120) -->
  <g transform="translate(20, 20)">
    <!-- Icon Backdrop -->
    <rect width="120" height="120" rx="28" fill="#090D16" stroke="#1E293B" stroke-width="2"/>
    
    <!-- Subtle Grid -->
    <circle cx="60" cy="60" r="42" fill="none" stroke="#1E293B" stroke-width="1" stroke-dasharray="2 4" opacity="0.6"/>

    <!-- Cross Linkage -->
    <path d="M 30 35 L 60 56 L 90 35" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.6"/>
    <path d="M 46 86 L 74 86" fill="none" stroke="#6366F1" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.6"/>

    <!-- Ambient Glow -->
    <path d="M 30 35 L 46 86 L 60 56 L 74 86 L 90 35" 
          fill="none" 
          stroke="url(#icon-grad)" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          opacity="0.3" 
          filter="url(#h-glow)"/>

    <!-- Primary 'W' Stroke -->
    <path d="M 30 35 L 46 86 L 60 56 L 74 86 L 90 35" 
          fill="none" 
          stroke="url(#icon-grad)" 
          stroke-width="6.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- High Velocity Center Core -->
    <path d="M 30 35 L 46 86 L 60 56 L 74 86 L 90 35" 
          fill="none" 
          stroke="#E0F2FE" 
          stroke-width="1.8" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Nodes -->
    <circle cx="30" cy="35" r="3.5" fill="#FFFFFF"/>
    <circle cx="46" cy="86" r="4" fill="#FFFFFF"/>
    <circle cx="60" cy="56" r="4.5" fill="#38BDF8"/>
    <circle cx="74" cy="86" r="4" fill="#FFFFFF"/>
    <circle cx="90" cy="35" r="3.5" fill="#FFFFFF"/>
  </g>

  <!-- Typography Brand Lockup -->
  <g transform="translate(170, 0)">
    <!-- Main Logotype -->
    <text x="0" y="86" 
          font-family="system-ui, -apple-system, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, sans-serif" 
          font-size="52" 
          font-weight="850" 
          letter-spacing="-1.5">
      <tspan fill="url(#text-grad)">WEAVE</tspan><tspan fill="url(#crawl-accent)">CRAWL</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="3" y="118" 
          font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" 
          font-size="13" 
          font-weight="700" 
          letter-spacing="3.5" 
          fill="#06B6D4">
      STRUCTURAL MEMORY · BROWSER AGENT
    </text>

    <!-- Signal Badge -->
    <g transform="translate(425, 62)">
      <rect x="0" y="0" width="76" height="22" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <circle cx="10" cy="11" r="3.5" fill="#10B981"/>
      <text x="20" y="15" 
            font-family="'SF Mono', Menlo, Consolas, Monaco, monospace" 
            font-size="10.5" 
            font-weight="700" 
            letter-spacing="1" 
            fill="#94A3B8">v0.1.0</text>
    </g>
  </g>
</svg>
