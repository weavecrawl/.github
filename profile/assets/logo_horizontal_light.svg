<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" width="100%" height="100%">
  <defs>
    <linearGradient id="text-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="crawl-accent-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891B2" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <linearGradient id="icon-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891B2" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(20, 20)">
    <!-- Icon Backdrop -->
    <rect width="120" height="120" rx="28" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
    
    <!-- Subtle Grid -->
    <circle cx="60" cy="60" r="42" fill="none" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="2 4" opacity="0.6"/>

    <!-- Cross Linkage -->
    <path d="M 30 35 L 60 56 L 90 35" fill="none" stroke="#0284C7" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.5"/>
    <path d="M 46 86 L 74 86" fill="none" stroke="#4F46E5" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.5"/>

    <!-- Primary 'W' Stroke -->
    <path d="M 30 35 L 46 86 L 60 56 L 74 86 L 90 35" 
          fill="none" 
          stroke="url(#icon-grad-light)" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Inner Highlight -->
    <path d="M 30 35 L 46 86 L 60 56 L 74 86 L 90 35" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="1.8" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          opacity="0.8"/>

    <!-- Nodes -->
    <circle cx="30" cy="35" r="4" fill="#0284C7"/>
    <circle cx="46" cy="86" r="4" fill="#4F46E5"/>
    <circle cx="60" cy="56" r="5" fill="#7C3AED"/>
    <circle cx="74" cy="86" r="4" fill="#4F46E5"/>
    <circle cx="90" cy="35" r="4" fill="#0284C7"/>
  </g>

  <!-- Typography Brand Lockup -->
  <g transform="translate(170, 0)">
    <!-- Main Logotype -->
    <text x="0" y="86" 
          font-family="system-ui, -apple-system, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, sans-serif" 
          font-size="52" 
          font-weight="850" 
          letter-spacing="-1.5">
      <tspan fill="url(#text-dark)">WEAVE</tspan><tspan fill="url(#crawl-accent-light)">CRAWL</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="3" y="118" 
          font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" 
          font-size="13" 
          font-weight="700" 
          letter-spacing="3.5" 
          fill="#0284C7">
      STRUCTURAL MEMORY · BROWSER AGENT
    </text>

    <!-- Badge -->
    <g transform="translate(425, 62)">
      <rect x="0" y="0" width="76" height="22" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
      <circle cx="10" cy="11" r="3.5" fill="#059669"/>
      <text x="20" y="15" 
            font-family="'SF Mono', Menlo, Consolas, Monaco, monospace" 
            font-size="10.5" 
            font-weight="700" 
            letter-spacing="1" 
            fill="#475569">v0.1.0</text>
    </g>
  </g>
</svg>
